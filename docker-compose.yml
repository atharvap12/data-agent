# Values in ${...} come from .env in this folder. Only the variables listed
# under `environment` are passed into the container.
services:
  postgres:
    image: postgres:16
    container_name: data-agent-pg
    restart: unless-stopped
    # Creates the app roles and database on every start if they don't exist.
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "${port:-5432}:5432"   # host:container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${admin_password}
      APP_DB_NAME: ${database}
      APP_DB_OWNER: ${admin_user}              # owns the db; feed_db.py loads data with it
      APP_DB_OWNER_PASSWORD: ${admin_password}
      APP_DB_READER: ${user}                   # read-only
      APP_DB_READER_PASSWORD: ${password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    # Healthy only once the read-only role can log in to the app database.
    # $$ leaves the variable for the container's shell instead of Compose.
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$APP_DB_READER_PASSWORD psql -h 127.0.0.1 -U $$APP_DB_READER -d $$APP_DB_NAME -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
    name: data-agent-pgdata
